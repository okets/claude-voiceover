[project]
name = "claude-voiceover-tts"
version = "1.0.0"
description = "TTS engine dependencies for the Claude Voiceover plugin (Kokoro subprocess layer)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "kokoro-onnx>=0.4.9",
    "soundfile>=0.13.1",
    "numpy>=1.24.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
exclude = ["*"]
